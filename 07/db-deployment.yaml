apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.8.1-ubi9-rc
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: wordpress-secret
          resources:
            requests:
              memory: "300Mi"
              cpu: "100m"
            limits:
              memory: "900Mi"
              cpu: "300m"
          volumeMounts:
            - name: db-data-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: db-data-storage
          persistentVolumeClaim:
            claimName: db-data-pvc
